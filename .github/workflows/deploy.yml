name: Deploy to Azure

# Manual only: run from the Actions tab when a release should go live.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build web app
        working-directory: web
        run: npm ci || npm install && npm run build
      - name: Test and publish services
        run: |
          dotnet test tests/FinTrack.Tests -c Release
          for p in Gateway Accounts Transactions Budgets Functions; do
            dotnet publish src/FinTrack.$p -c Release -o out/$p
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision infrastructure (Bicep)
        id: infra
        run: |
          out=$(az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -f infra/main.bicep -p budgetAlertEmail="${{ vars.BUDGET_ALERT_EMAIL }}" --query properties.outputs -o json)
          echo "apps=$(echo $out | jq -c '.appNames.value')" >> $GITHUB_OUTPUT
          echo "func=$(echo $out | jq -r '.functionApp.value')" >> $GITHUB_OUTPUT
      - name: Deploy web apps
        run: |
          names='${{ steps.infra.outputs.apps }}'
          i=0
          for svc in Gateway Accounts Transactions Budgets; do
            app=$(echo "$names" | jq -r ".[$i]")
            (cd out/$svc && zip -qr ../$svc.zip .)
            az webapp deploy -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$app" --src-path out/$svc.zip --type zip
            i=$((i+1))
          done
      - name: Deploy functions
        run: |
          (cd out/Functions && zip -qr ../functions.zip .)
          az functionapp deployment source config-zip -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.infra.outputs.func }}" --src out/functions.zip
